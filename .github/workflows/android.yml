name: Android build

# Builds the debug APK and launches it on an emulator, since the owner's PC has
# no JDK or Android SDK. The APK is kept as a run artifact to sideload on a phone.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - apps/mobile/android/**
      - apps/mobile/capacitor.config.ts
      - apps/mobile/package.json
      - .github/workflows/android.yml

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Debug APK + emulator launch
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install
        run: npm ci

      - name: Build the web app and sync it into android/
        working-directory: apps/mobile
        run: npm run build && npx cap sync android

      - name: Gradle assembleDebug
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v7
        with:
          name: nem-mail-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n com.onahstephen.nemmail/.MainActivity
            sleep 20
            adb exec-out screencap -p > emulator.png
            adb logcat -d > logcat.txt
            adb shell pidof com.onahstephen.nemmail
            ! grep -E "FATAL EXCEPTION|AndroidRuntime: Process: com.onahstephen.nemmail" logcat.txt
            grep -E "Capacitor" logcat.txt | tail -40

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: emulator-launch
          path: |
            emulator.png
            logcat.txt
          if-no-files-found: ignore
