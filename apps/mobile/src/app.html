<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!-- Until a page sets its own (Svelte writes document.title), e.g. while a deep link boots. -->
		<title>Nem Mail</title>
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#0b0b14" />
		<meta name="text-scale" content="scale" />
		<!-- PWA: installable on Android and "Add to Home Screen" on iOS (T12.1). -->
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Nem Mail" />
		<!-- The page draws under the status bar; safe-area insets keep content clear of it. -->
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<!-- iOS launch images, one per iPhone screen (portrait). -->
		<link
			rel="apple-touch-startup-image"
			media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)"
			href="%sveltekit.assets%/icons/splash/splash-1290x2796.png"
		/>
		<link
			rel="apple-touch-startup-image"
			media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)"
			href="%sveltekit.assets%/icons/splash/splash-1179x2556.png"
		/>
		<link
			rel="apple-touch-startup-image"
			media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3)"
			href="%sveltekit.assets%/icons/splash/splash-1284x2778.png"
		/>
		<link
			rel="apple-touch-startup-image"
			media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)"
			href="%sveltekit.assets%/icons/splash/splash-1170x2532.png"
		/>
		<link
			rel="apple-touch-startup-image"
			media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)"
			href="%sveltekit.assets%/icons/splash/splash-1125x2436.png"
		/>
		<link
			rel="apple-touch-startup-image"
			media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2)"
			href="%sveltekit.assets%/icons/splash/splash-828x1792.png"
		/>
		<link
			rel="apple-touch-startup-image"
			media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)"
			href="%sveltekit.assets%/icons/splash/splash-750x1334.png"
		/>
		<link
			rel="apple-touch-startup-image"
			media="(device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2)"
			href="%sveltekit.assets%/icons/splash/splash-640x1136.png"
		/>
		<script>
			// No-flash theme init: paints the saved or system theme before the first frame.
			// Mirrors THEME_STORAGE_KEY and resolveTheme in lib/utils/theme.ts; the colors are
			// --nm-color-bg from tokens.css. theme.test.ts checks they stay in sync.
			(function () {
				var preference = null;
				try {
					preference = localStorage.getItem('nm-theme');
				} catch (e) {}
				var isLight =
					preference === 'light' ||
					(preference !== 'dark' &&
						!!window.matchMedia &&
						matchMedia('(prefers-color-scheme: light)').matches);
				document.documentElement.dataset.theme = isLight ? 'light' : 'dark';
				document
					.querySelector('meta[name="theme-color"]')
					.setAttribute('content', isLight ? '#faf7f2' : '#0b0b14');
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
