# Local development services: docker compose up -d (from apps/api).
name: nem-mail

services:
  postgres:
    # Postgres 16 with the pgvector extension available (enabled by a migration).
    image: pgvector/pgvector:0.8.7-pg16
    environment:
      POSTGRES_DB: ${DB_NAME:-nemmail}
      POSTGRES_USER: ${DB_USER:-nemmail}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nemmail}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    # Catches mail sent to external addresses in development. Web UI on 8025.
    image: axllent/mailpit:v1.31.2
    ports:
      - '${MAIL_PORT:-1025}:1025'
      - '8025:8025'

volumes:
  pgdata:
