spring:
  application:
    name: nem-mail-api
  autoconfigure:
    # Users sign in with bearer tokens, not Spring's generated in-memory user.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  threads:
    virtual:
      enabled: true
  # No defaults on purpose: production must set these, and startup fails fast if
  # it does not. The local profile and the tests supply their own.
  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      # Neon free: few connections, and none held while idle so the compute can
      # suspend. A longer connect timeout covers Neon waking from suspend.
      maximum-pool-size: 5
      minimum-idle: 0
      idle-timeout: 60000 # ms (Hikari binds plain longs)
      max-lifetime: 300000
      connection-timeout: 15000
  jpa:
    open-in-view: false
    properties:
      hibernate:
        # Batch inserts (ids are assigned in Java, so Hibernate can batch); the
        # seed would otherwise be thousands of round trips to Neon.
        jdbc.batch_size: 50
        order_inserts: true
    hibernate:
      # Flyway owns the schema; Hibernate only checks the entities match it.
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      # MAX_ATTACHMENT_BYTES; a bigger upload is a 413 before it is read.
      max-file-size: 10MB
      max-request-size: 11MB

server:
  # Render injects PORT; 8080 locally.
  port: ${PORT:8080}
  # Tomcat's RemoteIpValve: X-Forwarded-For counts only when an internal proxy
  # (Render's) sent it, so clients cannot fake their IP for the rate limiter.
  forward-headers-strategy: native
  tomcat:
    # Read the rest of an upload over the 10 MB limit, so the client gets the 413
    # envelope instead of a dropped connection.
    max-swallow-size: 12MB
  servlet:
    context-path: /api/v1
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      # Actuator under the API root, so health is /api/v1/health.
      base-path: /
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  structured:
    # One JSON object per line (Elastic Common Schema) with the requestId from
    # the MDC, so the host's log search can filter by request.
    format:
      console: ecs

springdoc:
  # Several response records are nested classes called Response; full names keep their
  # schemas apart instead of one overwriting the others.
  use-fqn: true

nem:
  cors:
    allowed-origins:
      - https://nem-mail.vercel.app
      - capacitor://localhost # iOS shell
      - https://localhost # Android shell
  rate-limit:
    requests-per-minute: 120
    # Sign-in and sign-up: enough for typos, too few to guess passwords.
    auth-requests-per-minute: 10
  demo:
    # Public: the same DEMO_PASSWORD the app sends for "Try the demo".
    password: demo-account
    # Shared with the nightly demo-reset GitHub Actions workflow; unset turns
    # POST /admin/demo/reset off.
    reset-key: ${DEMO_RESET_KEY:}
  ai:
    ingest:
      enabled: true
    embeddings:
      # Off: needs a -PwithEmbeddings build and ~150 MB more memory than Render
      # free has to spare. The app computes MiniLM embeddings on the device.
      enabled: ${AI_EMBEDDINGS:false}
      model-url: djl://ai.djl.huggingface.onnxruntime/sentence-transformers/all-MiniLM-L6-v2
      timeout: 5s
    ollama:
      # Local development only; blank turns it off. qwen2.5:0.5b is Apache-2.0.
      url: ${OLLAMA_URL:}
      model: qwen2.5:0.5b
      timeout: 20s
